services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw-local:latest
    container_name: openclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env's GH_CONFIG_DIR / PTAH_CONFIG_DIR hold HOST paths (used as bind-mount
      # sources by docker compose). Inside the container those paths don't exist —
      # override with container-internal paths so `gh` and `ptah` find their config.
      GH_CONFIG_DIR: /home/agent/.config/gh
      PTAH_CONFIG_DIR: /home/agent/.ptah
      # openclaw-control daemon — paths inside the container.
      OPENCLAW_HOST: 0.0.0.0
      OPENCLAW_PORT: 7878
      OPENCLAW_PROJECT_ROOTS: /home/agent/.openclaw/workspace
      OPENCLAW_LOCAL_MEMORY: /home/agent/.claude/local-memory
      OPENCLAW_DASHBOARD_DIR: /opt/openclaw-control/dashboard/browser
      REDIS_URL: redis://openclaw-redis:6379
      PTAH_BIN: ptah
      PTAH_INVOKER_PROFILE: claude_code
      PTAH_INVOKER_AUTO_APPROVE: "1"
      # SQLite spec store — leader writes to /data/specs.db (named volume).
      # Followers ignore this path; they hit the leader over HTTP.
      OPENCLAW_SPECS_DB_PATH: ${OPENCLAW_SPECS_DB_PATH:-/data/specs.db}
      # Follower mode: HTTP base URL of the leader's daemon (only meaningful when OPENCLAW_LEADER=0).
      OPENCLAW_LEADER_URL: ${OPENCLAW_LEADER_URL:-}
      # Dispatch poison threshold — K consecutive failures per (project, task, phase) → poisoned.
      OPENCLAW_DISPATCH_FAILURE_THRESHOLD: ${OPENCLAW_DISPATCH_FAILURE_THRESHOLD:-3}
      # Daemon delegates orchestration to host-side scripts/ptah-bridge.mjs.
      # Leave OPENCLAW_PTAH_BRIDGE_URL empty in .env to fall back to in-container ptah spawn.
      OPENCLAW_PTAH_BRIDGE_URL: ${OPENCLAW_PTAH_BRIDGE_URL:-http://host.docker.internal:8744}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    pids_limit: 768
    ports:
      # Existing openclaw gateway
      - "127.0.0.1:18789:18789"
      # openclaw-control daemon (REST + SSE + dashboard) — bound to localhost on the host.
      # Set OPENCLAW_CONTROL_BIND=0.0.0.0 in .env to expose to LAN (use Caddy/TLS for that).
      - "${OPENCLAW_CONTROL_BIND:-127.0.0.1}:7878:7878"
    depends_on:
      openclaw-redis:
        condition: service_healthy
    volumes:
      - ${WORKSPACE_DIR:-${HOME}/projects}:/home/agent/.openclaw/workspace:rw
      - ${SKILLS_DIR:-./skills}:/home/agent/.openclaw/skills:rw
      - openclaw-state:/home/agent/.openclaw
      # Share Ptah CLI config (auth, providers, settings, skills) with the host
      # so a single `ptah auth login` on either side works for both. Discord
      # chat is no longer routed through ptah — it goes direct to LLM_PROVIDER
      # — so the desktop's "claudeCli" auth method is fine here even when the
      # container lacks the Claude CLI binary. The orchestration loop runs ptah
      # on the host via the ptah-bridge service; see scripts/ptah-bridge.mjs.
      - ${PTAH_CONFIG_DIR:-${HOME}/.ptah}:/home/agent/.ptah:rw
      # TASK_2026_002 B6: identity-mapped bind-mount of ~/.ptah so the daemon
      # writes per-agent settings.json + the per-persona plugin tree at the
      # same path the bridge sees. The daemon emits host paths (computed via
      # OPENCLAW_HOST_HOME); the bridge identity-translates `~/.ptah/...`.
      # Same path on both sides — the ${PTAH_CONFIG_DIR} mount above maps to
      # /home/agent/.ptah for backwards compat with ptah's container-side
      # auth state; this entry maps the host path identity-style.
      - ${OPENCLAW_HOST_HOME:-${HOME}}/.ptah:${OPENCLAW_HOST_HOME:-${HOME}}/.ptah:rw
      # Share `gh` CLI auth with the host so a single `gh auth login` on the
      # host gives the agent access to private repos / PR creation / etc.
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/agent/.config/gh:rw
      # ---- openclaw-control mounts ----
      # SQLite spec store. The leader's daemon opens /data/specs.db on boot and
      # runs migrations; followers never write here (they go HTTP-only via
      # OPENCLAW_LEADER_URL) so the volume is harmless on follower hosts. If you
      # prefer a leader-only attach, move this line into a docker-compose.override.leader.yml.
      - specs-db:/data
      # Local memory: NEVER synced. Holds private agent personas (system prompts) and
      # any per-machine secrets. Each machine has its own — Anubis's persona never
      # leaves the leader machine, Amun's never leaves Amun's host.
      - ${OPENCLAW_LOCAL_MEMORY_DIR:-${HOME}/.claude/local-memory}:/home/agent/.claude/local-memory:rw
      # Live Claude Code session JSONL files from the host. Read-only — bots tail these
      # to surface "what is the user doing right now" in the live-sessions feed.
      - ${HOME}/.claude/projects:/home/agent/.claude/projects:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18789/ | grep -qE '^(200|301|302|401|403|404)$' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Redis backs the cross-agent handoff bus (agent:<id>:inbox channels).
  # Tiny, in-memory only, internal network only — never published to host.
  openclaw-redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  openclaw-state:
  specs-db: {}
