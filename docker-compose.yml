# TASK_2026_006 Batch 5b: three-service compose. The openclaw stack is now
# split into independent gateway / daemon / redis containers so the plugin
# install pipeline (Batch 8b) can restart the gateway without taking the
# daemon (and its dashboard approval UI) down with it.
#
# Both openclaw-* application services use the SAME image — only
# OPENCLAW_CONTAINER_ROLE differs, which entrypoint.sh reads to select the
# boot path. See docs/OPERATIONS.md for runtime details.
#
# Production endpoints (bound to 127.0.0.1 by default):
#   :18789  openclaw gateway (HTTP + WebSocket)
#   :7878   openclaw-control daemon (REST + SSE + dashboard)
#
# For alternate-port local testing without colliding with a host-native
# stack, use docker-compose.test.yml instead.

services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw-local:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCLAW_CONTAINER_ROLE: gateway
      # GH_CONFIG_DIR / PTAH_CONFIG_DIR in .env hold HOST paths used as
      # bind-mount sources below. Inside the container override with the
      # container-internal paths so gh/ptah find their config.
      GH_CONFIG_DIR: /home/agent/.config/gh
      PTAH_CONFIG_DIR: /home/agent/.ptah
      # The plugin reaches host-side ptah-bridge via host.docker.internal.
      OPENCLAW_PTAH_BRIDGE_URL: ${OPENCLAW_PTAH_BRIDGE_URL:-http://host.docker.internal:8744}
      # The openclaw-control-plugin (loaded in this container) calls the
      # daemon over inter-container DNS. The .env default of
      # http://localhost:7878 only works for the legacy single-container
      # layout; in the split-container layout the daemon is a sibling.
      OPENCLAW_DAEMON_URL: ${OPENCLAW_DAEMON_URL_GATEWAY:-http://openclaw-daemon:7878}
      # TASK_2026_006 Batch 9: dual-config cutover window. Both the old
      # single-token (DISCORD_BOT_TOKEN) and the new per-persona tokens are
      # surfaced into the container side-by-side. The new tokens drive the
      # multi-agent template rendered to /etc/openclaw/openclaw.json.new;
      # the old token still drives the currently-running openclaw.json.
      # Batch 11 removes DISCORD_BOT_TOKEN after the cutover is stable.
      DISCORD_TOKEN_ANUBIS: ${DISCORD_TOKEN_ANUBIS:-}
      DISCORD_TOKEN_HORUS: ${DISCORD_TOKEN_HORUS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    pids_limit: 768
    ports:
      - "127.0.0.1:18789:18789"
    depends_on:
      openclaw-redis:
        condition: service_healthy
    volumes:
      # Named volumes (per amendment §9.1 / §9.5). The nested mounts
      # (extensions, skills) are belt-and-braces — if openclaw-state's mount
      # is ever removed, installed plugins/skills still survive.
      - openclaw-state:/home/agent/.openclaw
      - openclaw-extensions:/home/agent/.openclaw/extensions
      - openclaw-skills:/home/agent/.openclaw/skills
      # Host bind-mounts (read-only where safe).
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/agent/.config/gh:ro
      - ${PTAH_CONFIG_DIR:-${HOME}/.ptah}:/home/agent/.ptah:rw
      # TASK_2026_002 B6 identity-mapped ptah path (same source as above,
      # different mount target so daemon-emitted host paths resolve inside
      # the container too).
      - ${OPENCLAW_HOST_HOME:-${HOME}}/.ptah:${OPENCLAW_HOST_HOME:-${HOME}}/.ptah:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:18789/health || curl -fsS -o /dev/null http://127.0.0.1:18789/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  openclaw-daemon:
    image: openclaw-local:latest
    container_name: openclaw-daemon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCLAW_CONTAINER_ROLE: daemon
      OPENCLAW_HOST: 0.0.0.0
      OPENCLAW_PORT: 7878
      OPENCLAW_PROJECT_ROOTS: /workspace
      OPENCLAW_DASHBOARD_DIR: /opt/openclaw-control/dashboard/browser
      OPENCLAW_SPECS_DB_PATH: ${OPENCLAW_SPECS_DB_PATH:-/data/specs.db}
      OPENCLAW_LEADER_URL: ${OPENCLAW_LEADER_URL:-}
      OPENCLAW_DISPATCH_FAILURE_THRESHOLD: ${OPENCLAW_DISPATCH_FAILURE_THRESHOLD:-3}
      OPENCLAW_PTAH_BRIDGE_URL: ${OPENCLAW_PTAH_BRIDGE_URL:-http://host.docker.internal:8744}
      REDIS_URL: redis://openclaw-redis:6379
      # The daemon reaches the sibling gateway over the docker network.
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-http://openclaw-gateway:18789}
      # Batch 8b: the daemon restarts the gateway after plugin installs via
      # the bind-mounted docker socket. Name the container so dockerode can
      # find it (matches container_name above).
      OPENCLAW_GATEWAY_CONTAINER: openclaw-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    ports:
      - "${OPENCLAW_CONTROL_BIND:-127.0.0.1}:7878:7878"
    depends_on:
      openclaw-gateway:
        condition: service_started
      openclaw-redis:
        condition: service_healthy
    volumes:
      # SQLite spec store (leader writes; follower deployments leave the
      # volume harmlessly empty — daemon takes the HTTP path when
      # OPENCLAW_LEADER_URL is set).
      - openclaw-data:/data
      # Read-only mirror of the gateway's state — daemon reads
      # ~/.openclaw/openclaw.json + plugins metadata to drive the install /
      # restart pipeline. Read-only so the daemon can't corrupt the gateway.
      - openclaw-state:/home/agent/.openclaw:ro
      # The plugin install pipeline (Batch 8b) needs to docker-restart
      # openclaw-gateway. The socket bind grants the daemon container full
      # control of the host's docker — documented in docs/OPERATIONS.md.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:7878/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  openclaw-redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  openclaw-state:        # ~/.openclaw/ — openclaw.json, logs, plugin-runtime-deps cache
  openclaw-extensions:   # ~/.openclaw/extensions/ — user-installed plugins
  openclaw-skills:       # ~/.openclaw/skills/    — user-installed skills (incl. MCP bundles)
  openclaw-data:         # /data/                  — daemon SQLite (specs.db + extension_install_requests)
